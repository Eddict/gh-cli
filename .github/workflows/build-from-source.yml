name: Build gh (upload artifact)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build gh (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build gh
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # Build the gh CLI. Adjust the package path if your repo layout differs.
          go build -trimpath -ldflags "-s -w" -o dist/gh ./cmd/gh
          ./dist/gh version

      - name: Compute short SHA
        id: vars
        shell: bash
        run: echo "short_sha=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      # Alias artifact name (easy to download without knowing SHA)
      - name: Upload gh binary (alias)
        uses: actions/upload-artifact@v4
        with:
          name: gh-${{ matrix.os }}
          if-no-files-found: error
          path: dist/gh
          retention-days: 7

      # Versioned artifact name (unique, traceable)
      - name: Upload gh binary (versioned)
        uses: actions/upload-artifact@v4
        with:
          name: gh-${{ matrix.os }}-${{ steps.vars.outputs.short_sha }}
          if-no-files-found: error
          path: dist/gh
          retention-days: 7
