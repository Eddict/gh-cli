name: Fork Tag & Trigger Deployment

on:
  workflow_dispatch:
    inputs:
      upstream_version:
        description: 'Upstream version (e.g. v3.2.1). Leave blank to auto-detect.'
        required: false
        type: string
      fork_number:
        description: 'Fork iteration (e.g. 1)'
        required: true
        type: string
      environment:
        description: 'Deployment environment (default: production)'
        required: false
        type: environment
        default: production
      platforms:
        description: 'Platforms (linux,macos,windows)'
        required: false
        type: string
        default: "linux,macos,windows"
      release:
        description: 'Create GitHub Release?'
        required: false
        type: boolean
        default: true

jobs:
  tag-and-trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find latest synced upstream tag (fast)
        id: latest_upstream_tag
        run: |
          set -e
          git remote add upstream https://github.com/cli/cli.git || true
          # Fetch all upstream tags in one go -- this is much faster!
          git fetch upstream --tags --quiet
          # Search all tags matching the vN.N.N format, sorted from newest to oldest
          for tag in $(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -Vr); do
            commit=$(git rev-list -n 1 "$tag")
            if git merge-base --is-ancestor $commit HEAD; then
              echo "Latest upstream tag you're synced with: $tag"
              echo "upstream_tag=$tag" >> $GITHUB_OUTPUT
              exit 0
            fi
          done
          echo "No matching upstream tag found"
          echo "upstream_tag=" >> $GITHUB_OUTPUT

      - name: Compute upstream version for tag
        id: compute_tag
        run: |
          input_version="${{ github.event.inputs.upstream_version }}"
          detected_version="${{ steps.latest_upstream_tag.outputs.upstream_tag }}"
          final_version="$input_version"
          if [ -z "$final_version" ]; then
            final_version="$detected_version"
          fi
          if [ -z "$final_version" ]; then
            echo "Error: Could not determine upstream version, and no input provided."
            exit 1
          fi
          echo "Using upstream_version: $final_version"
          echo "upstream_version=$final_version" >> $GITHUB_OUTPUT

      - name: Create fork tag and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.compute_tag.outputs.upstream_version }}-fork.${{ github.event.inputs.fork_number }}"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Created and pushed tag: $TAG"

      - name: Trigger deployment workflow via workflow_dispatch API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/deployment.yml/dispatches \
            -d '{
              "ref": "trunk",
              "inputs": {
                "tag_name": "'"${{ steps.compute_tag.outputs.upstream_version }}-fork.${{ github.event.inputs.fork_number }}"'",
                "environment": "'"${{ github.event.inputs.environment }}"'",
                "platforms": "'"${{ github.event.inputs.platforms }}"'",
                "release": "'"${{ github.event.inputs.release }}"'"
              }
            }'
